name: Release desktop

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            rust_targets: aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            rust_targets: x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
            rust_targets: ""
          - platform: ubuntu-22.04-arm
            args: ""
            rust_targets: ""
          - platform: windows-latest
            args: ""
            rust_targets: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Linux WebKit / tray deps
        if: startsWith(matrix.platform, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libssl-dev

      - name: Install frontend deps
        run: npm ci

      - name: Build & upload release assets
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Replaced from tauri.conf.json / Cargo.toml by tauri-action
          tagName: v__VERSION__
          releaseName: Traylist v__VERSION__
          releaseBody: |
            Desktop installers for this version.

            **Install (Linux / macOS):**
            ```bash
            curl -fsSL https://raw.githubusercontent.com/Haroon966/traylist/main/scripts/install.sh | bash
            ```

            **Install (Windows PowerShell):**
            ```powershell
            irm https://raw.githubusercontent.com/Haroon966/traylist/main/scripts/install.ps1 | iex
            ```
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
          # Stable names so install.sh can match OS/arch/ext reliably
          releaseAssetNamePattern: Traylist-[version]-[platform]-[arch][ext]
